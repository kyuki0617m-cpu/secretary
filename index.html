<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ秘書</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --line: #e7e9ee;
    --line-soft: #eef0f4;
    --text: #191d26;
    --muted: #767f8c;
    --faint: #9aa2ae;

    /* メモ = アンバー、タスク = インディゴ、完了 = グリーン */
    --memo: #b1731a;
    --memo-soft: #fdf7ee;
    --memo-line: #ecd9b8;

    --task: #4059c8;
    --task-soft: #f4f6fd;
    --task-line: #d3daf4;

    --done: #17794c;
    --done-soft: #f4f9f6;
    --done-line: #cbe4d7;

    /* 振り返り = パープル */
    --review: #6f4bb0;
    --review-soft: #f8f5fd;
    --review-line: #ded3f0;

    --danger: #c0392f;

    --shadow-sm: 0 1px 2px rgba(19, 24, 36, .05);
    --shadow-md: 0 6px 18px -10px rgba(19, 24, 36, .28), 0 1px 2px rgba(19, 24, 36, .04);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    padding: 44px 20px 96px;
    background:
      radial-gradient(1100px 420px at 50% -180px, #ffffff 0%, rgba(255,255,255,0) 70%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  /* ── ヘッダー ───────────────────────────── */
  header { margin-bottom: 26px; }
  h1 {
    font-size: 25px;
    font-weight: 650;
    letter-spacing: .02em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .mark {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--memo), var(--task));
  }
  .today {
    margin: 4px 0 0 19px;
    color: var(--faint);
    font-size: 13px;
    letter-spacing: .04em;
  }

  /* ── ダッシュボード ─────────────────────── */
  .dash {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .stat {
    position: relative;
    font: inherit;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px 14px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .stat::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--line);
  }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat:active { transform: translateY(0); }
  .stat:focus-visible { outline: 2px solid var(--task); outline-offset: 2px; }
  .stat .num {
    font-size: 34px;
    font-weight: 680;
    line-height: 1.15;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat .label {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: .03em;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat .arrow {
    color: var(--faint);
    font-size: 12px;
    opacity: 0;
    transform: translateY(-1px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .stat:hover .arrow, .stat:focus-visible .arrow { opacity: 1; transform: translateY(1px); }

  .stat.memo::before { background: var(--memo); }
  .stat.memo .num { color: var(--memo); }
  .stat.tasks::before { background: var(--task); }
  .stat.tasks .num { color: var(--task); }
  .stat.todo::before { background: var(--danger); }
  .stat.todo .num { color: var(--danger); }
  .stat.todo.clear::before { background: var(--done); }
  .stat.todo.clear .num { color: var(--done); }

  /* 最新の振り返り（ダッシュボード内） */
  .latest {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    position: relative;
    background: var(--review-soft);
    border: 1px solid var(--review-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 15px 18px 16px;
    margin-bottom: 34px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .latest::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--review);
  }
  .latest:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .latest:active { transform: translateY(0); }
  .latest:focus-visible { outline: 2px solid var(--review); outline-offset: 2px; }
  .latest .head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: .1em;
    color: var(--review);
    margin-bottom: 3px;
  }
  .latest .head .week {
    margin-left: auto;
    letter-spacing: .03em;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .latest .comment {
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: #333a45;
  }
  .latest.is-empty { background: #fcfcfd; border-style: dashed; border-color: var(--line); }
  .latest.is-empty::before { background: var(--line); }
  .latest.is-empty .head { color: var(--faint); }
  .latest.is-empty .comment { color: var(--faint); font-size: 13.5px; }

  /* ── カード ─────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 22px 24px;
    margin-bottom: 18px;
    scroll-margin-top: 24px;
  }
  h2 {
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .12em;
    margin: 0 0 16px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  h2 .count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--faint);
    background: var(--line-soft);
    border-radius: 999px;
    padding: 1px 10px;
  }
  .card.memo h2 { color: var(--memo); }
  .card.task-card h2 { color: var(--task); }
  .card.review h2 { color: var(--review); }

  /* クリックで移動したときに一瞬だけ光らせる */
  @keyframes flash {
    0%   { box-shadow: 0 0 0 0 rgba(64, 89, 200, .30), var(--shadow-sm); }
    100% { box-shadow: 0 0 0 12px rgba(64, 89, 200, 0), var(--shadow-sm); }
  }
  .card.flash { animation: flash 1.1s ease-out; }

  /* ── 入力欄 ─────────────────────────────── */
  input[type="text"], textarea, select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
    background: #fcfcfd;
    color: inherit;
    margin-bottom: 10px;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--faint); }
  textarea { resize: vertical; min-height: 92px; line-height: 1.7; }
  select { cursor: pointer; }
  input:focus, textarea:focus, select:focus { outline: none; background: #fff; }
  .card.memo input:focus, .card.memo textarea:focus {
    border-color: var(--memo);
    box-shadow: 0 0 0 3px rgba(177, 115, 26, .13);
  }
  .card.task-card input:focus {
    border-color: var(--task);
    box-shadow: 0 0 0 3px rgba(64, 89, 200, .13);
  }
  .card.review textarea:focus, .card.review select:focus {
    border-color: var(--review);
    box-shadow: 0 0 0 3px rgba(111, 75, 176, .13);
  }
  .hint {
    font-size: 12.5px;
    color: var(--review);
    background: var(--review-soft);
    border: 1px solid var(--review-line);
    border-radius: 8px;
    padding: 6px 12px;
    margin: 0 0 10px;
  }
  .hint:empty { display: none; }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 9px 20px;
    background: var(--task);
    color: #fff;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .card.memo button[type="submit"] { background: var(--memo); }
  .card.task-card button[type="submit"] { background: var(--task); }
  .card.review button[type="submit"] { background: var(--review); }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row input[type="text"] { margin-bottom: 0; }
  .row button { flex: none; white-space: nowrap; }

  /* ── 一覧 ───────────────────────────────── */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    transition: box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }

  .memo-item {
    background: var(--memo-soft);
    border-color: var(--memo-line);
    border-left-color: var(--memo);
  }
  .memo-item:hover { box-shadow: var(--shadow-md); }

  .review-item {
    background: var(--review-soft);
    border-color: var(--review-line);
    border-left-color: var(--review);
  }
  .review-item:hover { box-shadow: var(--shadow-md); }
  .review-week {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-weight: 650;
    color: #563a8c;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }
  .review-week .tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: #fff;
    background: var(--review);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .review-body { white-space: pre-wrap; word-break: break-word; margin-top: 4px; color: #333a45; }
  .memo-title { font-weight: 650; color: #7d4f10; letter-spacing: .01em; }
  .memo-body { white-space: pre-wrap; word-break: break-word; margin-top: 3px; color: #333a45; }
  .meta {
    font-size: 11.5px;
    color: var(--faint);
    margin-top: 6px;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .empty {
    color: var(--faint);
    font-size: 13.5px;
    text-align: center;
    padding: 22px 16px;
    background: #fcfcfd;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }

  .task { display: flex; align-items: flex-start; gap: 12px; }
  .task input[type="checkbox"] {
    width: 17px; height: 17px;
    margin: 4px 0 0;
    flex: none;
    cursor: pointer;
  }
  .task .body { flex: 1; min-width: 0; }
  .task .title { word-break: break-word; font-weight: 600; letter-spacing: .01em; }

  .task.is-todo {
    background: var(--task-soft);
    border-color: var(--task-line);
    border-left-color: var(--task);
  }
  .task.is-todo input[type="checkbox"] { accent-color: var(--task); }
  .task.is-todo .title { color: #2c3f96; }
  .task.is-todo:hover { box-shadow: var(--shadow-md); }

  .task.is-done {
    background: var(--done-soft);
    border-color: var(--done-line);
    border-left-color: var(--done);
  }
  .task.is-done input[type="checkbox"] { accent-color: var(--done); }
  .task.is-done .title { text-decoration: line-through; color: var(--muted); font-weight: 500; }

  /* 「未完了タスク」から飛んできたときに未完了だけ強調する */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(64, 89, 200, 0); }
    35%      { box-shadow: 0 0 0 4px rgba(64, 89, 200, .20); }
  }
  li.pulse { animation: pulse 1.2s ease-out; }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    border-radius: 999px;
    padding: 1px 9px;
    margin-right: 9px;
    color: #fff;
    vertical-align: 1px;
  }
  .badge.done { background: var(--done); }
  .badge.todo { background: var(--task); }

  .del {
    background: transparent;
    color: var(--faint);
    border: 1px solid var(--line);
    padding: 3px 11px;
    font-size: 12.5px;
    font-weight: 500;
    flex: none;
    box-shadow: none;
  }
  .del:hover {
    background: #fdf2f1;
    border-color: #f0cdc9;
    color: var(--danger);
    filter: none;
  }

  .error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
  .error:empty { display: none; }

  @media (max-width: 620px) {
    body { padding: 28px 14px 72px; }
    .dash { grid-template-columns: 1fr; gap: 10px; }
    .card { padding: 18px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="mark" aria-hidden="true"></span>マイ秘書</h1>
    <p class="today" id="today"></p>
  </header>

  <!-- ダッシュボード（クリックでその一覧へ移動） -->
  <section class="dash" aria-label="ダッシュボード">
    <button type="button" class="stat memo" data-target="memo-list-section">
      <div class="num" id="stat-memos">0</div>
      <div class="label">メモの件数<span class="arrow" aria-hidden="true">↓</span></div>
    </button>
    <button type="button" class="stat tasks" data-target="task-list-section">
      <div class="num" id="stat-tasks">0</div>
      <div class="label">タスクの件数<span class="arrow" aria-hidden="true">↓</span></div>
    </button>
    <button type="button" class="stat todo" id="stat-open-card" data-target="task-list-section" data-pulse="todo">
      <div class="num" id="stat-open">0</div>
      <div class="label">未完了タスク<span class="arrow" aria-hidden="true">↓</span></div>
    </button>
  </section>

  <!-- 最新の振り返り（クリックで振り返り一覧へ移動） -->
  <button type="button" class="latest" id="latest-review" data-target="review-list-section">
    <div class="head">
      最新の振り返り
      <span class="week" id="latest-week"></span>
      <span class="arrow" aria-hidden="true">↓</span>
    </div>
    <div class="comment" id="latest-comment"></div>
  </button>

  <!-- メモ追加欄 -->
  <section class="card memo">
    <h2>メモを追加</h2>
    <form id="memo-form">
      <input type="text" id="memo-title" placeholder="タイトル" maxlength="200" autocomplete="off">
      <textarea id="memo-body" placeholder="本文"></textarea>
      <button type="submit">メモを追加</button>
      <p class="error" id="memo-error"></p>
    </form>
  </section>

  <!-- メモ一覧 -->
  <section class="card memo" id="memo-list-section">
    <h2>メモ一覧<span class="count"><span id="memo-count">0</span> 件</span></h2>
    <ul id="memo-list"></ul>
  </section>

  <!-- タスク追加欄 -->
  <section class="card task-card">
    <h2>タスクを追加</h2>
    <form id="task-form" class="row">
      <input type="text" id="task-title" placeholder="やること" maxlength="200" autocomplete="off">
      <button type="submit">追加</button>
    </form>
    <p class="error" id="task-error"></p>
  </section>

  <!-- タスク一覧 -->
  <section class="card task-card" id="task-list-section">
    <h2>タスク一覧<span class="count"><span id="task-count">0</span> 件</span></h2>
    <ul id="task-list"></ul>
  </section>

  <!-- 週次の振り返り記入欄 -->
  <section class="card review">
    <h2>週次の振り返り</h2>
    <form id="review-form">
      <select id="review-week" aria-label="振り返る週"></select>
      <p class="hint" id="review-hint"></p>
      <textarea id="review-comment" placeholder="今週はどうだった？ うまくいったこと・次に活かすこと"></textarea>
      <button type="submit">振り返りを保存</button>
      <p class="error" id="review-error"></p>
    </form>
  </section>

  <!-- 振り返り一覧 -->
  <section class="card review" id="review-list-section">
    <h2>振り返り一覧<span class="count"><span id="review-count">0</span> 件</span></h2>
    <ul id="review-list"></ul>
  </section>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
let state = { memos: [], tasks: [], reviews: [] };

const pad = (n) => String(n).padStart(2, '0');

const fmt = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

// ── 週まわりのヘルパー（週は「その週の月曜日」で表す） ──
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}

function parseYmd(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// 「2026/8/17 〜 8/23」のような表示にする
function weekRange(weekStart) {
  const from = parseYmd(weekStart);
  const to = new Date(from);
  to.setDate(to.getDate() + 6);
  return `${from.getFullYear()}/${from.getMonth() + 1}/${from.getDate()} 〜 ${to.getMonth() + 1}/${to.getDate()}`;
}

// 今週 / 先週 / 2週間前 …
function weekTag(weekStart) {
  const diff = Math.round((mondayOf(new Date()) - parseYmd(weekStart)) / 604800000);
  if (diff === 0) return '今週';
  if (diff === 1) return '先週';
  if (diff < 0) return `${-diff}週間後`;
  return `${diff}週間前`;
}

// ヘッダーの日付
{
  const d = new Date();
  const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  $('today').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${wd}）`;
}

async function api(url, options) {
  const res = await fetch(url, options);
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || '通信に失敗しました');
  return json;
}

function render() {
  // ダッシュボード
  const open = state.tasks.filter((t) => !t.done).length;
  $('stat-memos').textContent = state.memos.length;
  $('stat-tasks').textContent = state.tasks.length;
  $('stat-open').textContent = open;
  // 未完了が0件のときだけ緑（やり残しなし）に切り替える
  $('stat-open-card').classList.toggle('clear', open === 0);
  $('memo-count').textContent = state.memos.length;
  $('task-count').textContent = state.tasks.length;
  $('review-count').textContent = state.reviews.length;

  // ダッシュボードの「最新の振り返り」
  const latest = state.reviews[0];
  $('latest-review').classList.toggle('is-empty', !latest);
  if (latest) {
    $('latest-week').textContent = `${weekRange(latest.weekStart)}（${weekTag(latest.weekStart)}）`;
    $('latest-comment').textContent = latest.comment;
  } else {
    $('latest-week').textContent = '';
    $('latest-comment').textContent = 'まだ振り返りがありません。今週の振り返りを書いてみましょう。';
  }

  // メモ一覧
  const memoList = $('memo-list');
  memoList.textContent = '';
  if (state.memos.length === 0) {
    memoList.innerHTML = '<li class="empty">まだメモはありません。</li>';
  } else {
    for (const memo of state.memos) {
      const li = document.createElement('li');
      li.className = 'memo-item';

      const title = document.createElement('div');
      title.className = 'memo-title';
      title.textContent = memo.title;
      li.appendChild(title);

      if (memo.body) {
        const body = document.createElement('div');
        body.className = 'memo-body';
        body.textContent = memo.body;
        li.appendChild(body);
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '作成日時: ' + fmt(memo.createdAt);
      li.appendChild(meta);

      memoList.appendChild(li);
    }
  }

  // タスク一覧
  const taskList = $('task-list');
  taskList.textContent = '';
  if (state.tasks.length === 0) {
    taskList.innerHTML = '<li class="empty">まだタスクはありません。</li>';
  } else {
    for (const task of state.tasks) {
      const li = document.createElement('li');
      li.className = 'task ' + (task.done ? 'is-done' : 'is-todo');

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = task.done;
      check.title = task.done ? '未完了に戻す' : '完了済みにする';
      check.addEventListener('change', () => toggleTask(task.id, check.checked));
      li.appendChild(check);

      const body = document.createElement('div');
      body.className = 'body';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = task.title;
      body.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const badge = document.createElement('span');
      badge.className = 'badge ' + (task.done ? 'done' : 'todo');
      badge.textContent = task.done ? '完了' : '未完了';
      meta.appendChild(badge);
      meta.appendChild(document.createTextNode(
        '作成日時: ' + fmt(task.createdAt) +
        (task.done && task.completedAt ? '　完了日時: ' + fmt(task.completedAt) : '')
      ));
      body.appendChild(meta);
      li.appendChild(body);

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '削除';
      del.addEventListener('click', () => removeTask(task.id, task.title));
      li.appendChild(del);

      taskList.appendChild(li);
    }
  }

  // 振り返り一覧（新しい週が上）
  const reviewList = $('review-list');
  reviewList.textContent = '';
  if (state.reviews.length === 0) {
    reviewList.innerHTML = '<li class="empty">まだ振り返りはありません。</li>';
  } else {
    for (const review of state.reviews) {
      const li = document.createElement('li');
      li.className = 'review-item';

      const week = document.createElement('div');
      week.className = 'review-week';
      week.appendChild(document.createTextNode(weekRange(review.weekStart)));
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = weekTag(review.weekStart);
      week.appendChild(tag);
      li.appendChild(week);

      const body = document.createElement('div');
      body.className = 'review-body';
      body.textContent = review.comment;
      li.appendChild(body);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '記録日時: ' + fmt(review.createdAt) +
        (review.updatedAt ? '　更新日時: ' + fmt(review.updatedAt) : '');
      li.appendChild(meta);

      reviewList.appendChild(li);
    }
  }

  syncWeekForm();
}

// 選択中の週に既に振り返りがあれば、その内容を編集できるように出しておく
function syncWeekForm() {
  const weekStart = $('review-week').value;
  const existing = state.reviews.find((r) => r.weekStart === weekStart);
  const comment = $('review-comment');
  $('review-hint').textContent = existing ? 'この週は記録済みです。保存すると上書きされます。' : '';

  // 手入力の途中なら書き換えない（自動で入れた内容か、空のときだけ差し替える）
  if (comment.dataset.filled !== '1' && comment.value !== '') return;
  comment.value = existing ? existing.comment : '';
  comment.dataset.filled = existing ? '1' : '';
}
// 自分で打ち始めたら、以後は自動で書き換えない
$('review-comment').addEventListener('input', () => { $('review-comment').dataset.filled = ''; });

// 直近8週間を選べるようにする
function buildWeekOptions() {
  const select = $('review-week');
  const monday = mondayOf(new Date());
  for (let i = 0; i < 8; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() - i * 7);
    const value = ymd(d);
    const option = document.createElement('option');
    option.value = value;
    option.textContent = `${weekRange(value)}（${weekTag(value)}）`;
    select.appendChild(option);
  }
}
buildWeekOptions();
$('review-week').addEventListener('change', syncWeekForm);

// ダッシュボードのタイル → 対応する一覧までスクロール
function replay(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth; // アニメーションを再生し直すための再描画
  el.classList.add(cls);
}

for (const tile of document.querySelectorAll('.stat, .latest')) {
  tile.addEventListener('click', () => {
    const target = $(tile.dataset.target);
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    replay(target, 'flash');
    // 「未完了タスク」からのときは、未完了の行だけを強調する
    if (tile.dataset.pulse === 'todo') {
      for (const li of document.querySelectorAll('#task-list li.is-todo')) replay(li, 'pulse');
    }
  });
}

async function load() {
  state = await api('/api/data');
  render();
}

// メモ追加
$('memo-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('memo-error');
  err.textContent = '';
  const title = $('memo-title').value.trim();
  const body = $('memo-body').value.trim();
  if (!title && !body) {
    err.textContent = 'タイトルか本文のどちらかを入力してください。';
    return;
  }
  try {
    const memo = await api('/api/memos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body }),
    });
    state.memos.unshift(memo);
    $('memo-title').value = '';
    $('memo-body').value = '';
    $('memo-title').focus();
    render();
  } catch (ex) {
    err.textContent = ex.message;
  }
});

// タスク追加
$('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('task-error');
  err.textContent = '';
  const title = $('task-title').value.trim();
  if (!title) {
    err.textContent = 'タスク名を入力してください。';
    return;
  }
  try {
    const task = await api('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    state.tasks.unshift(task);
    $('task-title').value = '';
    $('task-title').focus();
    render();
  } catch (ex) {
    err.textContent = ex.message;
  }
});

// 週次の振り返りを保存（同じ週にもう一度保存すると上書き）
$('review-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('review-error');
  err.textContent = '';
  const weekStart = $('review-week').value;
  const comment = $('review-comment').value.trim();
  if (!comment) {
    err.textContent = '振り返りのコメントを入力してください。';
    return;
  }
  try {
    const review = await api('/api/reviews', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ weekStart, comment }),
    });
    const i = state.reviews.findIndex((r) => r.weekStart === review.weekStart);
    if (i !== -1) state.reviews[i] = review;
    else state.reviews.push(review);
    state.reviews.sort((a, b) => b.weekStart.localeCompare(a.weekStart));
    $('review-comment').dataset.filled = '1'; // 保存済みの内容として扱う
    render();
  } catch (ex) {
    err.textContent = ex.message;
  }
});

// 完了 / 未完了の切り替え
async function toggleTask(id, done) {
  try {
    const updated = await api('/api/tasks/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done }),
    });
    const i = state.tasks.findIndex((t) => t.id === id);
    if (i !== -1) state.tasks[i] = updated;
    render();
  } catch (ex) {
    $('task-error').textContent = ex.message;
    load();
  }
}

// 削除
async function removeTask(id, title) {
  if (!confirm(`タスク「${title}」を削除しますか？`)) {
    return;
  }
  try {
    await api('/api/tasks/' + id, { method: 'DELETE' });
    state.tasks = state.tasks.filter((t) => t.id !== id);
    render();
  } catch (ex) {
    $('task-error').textContent = ex.message;
    load();
  }
}

load().catch((ex) => {
  $('memo-error').textContent = '読み込みに失敗しました: ' + ex.message;
});
</script>
</body>
</html>
